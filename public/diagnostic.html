<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Diagnostic de connexion — Novexa</title>
  <link rel="icon" href="/novexa-icon.jpg" />
  <style>
    :root {
      --bg: #0a0a0f;
      --purple: #6366f1;
      --gradient: linear-gradient(135deg, #6366f1, #3b82f6);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: rgba(255,255,255,0.08);
      --card-bg: rgba(255,255,255,0.04);
      --vert: #6ee7b7;
      --rouge: #fca5a5;
      --jaune: #fcd34d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px 64px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
    }
    .enveloppe { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sous-titre { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
    .carte {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; margin-bottom: 18px;
    }
    .carte h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-dim); margin: 0 0 14px; font-weight: 600; }
    .ligne { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .ligne:last-child { border-bottom: none; }
    .ligne .etat { flex: 0 0 22px; font-size: 15px; }
    .ligne .corps { flex: 1; min-width: 0; }
    .ligne .intitule { font-weight: 500; }
    .ligne .detail { color: var(--text-muted); font-size: 13px; margin-top: 2px; word-break: break-word; }
    .ligne .remede { color: var(--jaune); font-size: 13px; margin-top: 6px; word-break: break-word; }
    .ok .etat { color: var(--vert); }
    .echec .etat { color: var(--rouge); }
    .alerte .etat { color: var(--jaune); }
    .attente .etat, .attente .intitule { color: var(--text-dim); }
    .verdict {
      border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
      border: 1px solid var(--border); font-size: 15px; display: none;
    }
    .verdict.visible { display: block; }
    .verdict.bon { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--vert); }
    .verdict.mauvais { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--rouge); }
    .verdict strong { display: block; margin-bottom: 6px; font-size: 16px; }
    .verdict .suite { color: var(--text); font-weight: 400; margin-top: 8px; }
    button {
      background: var(--gradient); color: #fff; border: none; border-radius: 10px;
      padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; margin: 4px 8px 4px 0;
    }
    button.secondaire { background: rgba(255,255,255,0.07); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: default; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 5px; word-break: break-all; }
    pre {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
      color: var(--text-muted); margin: 0;
    }
    a { color: #a5b4fc; }
    .pied { text-align: center; margin-top: 28px; font-size: 13px; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="enveloppe">
    <h1>Diagnostic de connexion</h1>
    <p class="sous-titre">
      Cette page teste, depuis votre navigateur, chaque maillon entre ce site et l'API.
      Elle n'envoie aucun mot de passe et ne modifie rien.
    </p>

    <div class="verdict" id="verdict"></div>

    <div class="carte">
      <h2>Contexte</h2>
      <div id="contexte"></div>
    </div>

    <div class="carte">
      <h2>Chaîne de connexion</h2>
      <div id="controles"></div>
      <div style="margin-top:16px">
        <button id="btn-relancer">Relancer les tests</button>
        <button class="secondaire" id="btn-reparer">Vider le cache et les jetons</button>
      </div>
    </div>

    <div class="carte">
      <h2>Rapport à transmettre au support</h2>
      <pre id="rapport">Tests en cours…</pre>
      <div style="margin-top:14px">
        <button class="secondaire" id="btn-copier">Copier le rapport</button>
      </div>
    </div>

    <p class="pied"><a href="/login.html">← Retour à la page de connexion</a></p>
  </div>
  <script src="/js/diagnostic.js"></script>
</body>
</html>
