<!DOCTYPE html>
<!-- build: auth-crossdomain-v2 -->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novexa — Connexion</title>
  <link rel="icon" type="image/jpeg" href="/novexa-icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --purple: #6366f1;
      --blue: #3b82f6;
      --gradient: linear-gradient(135deg, #6366f1, #3b82f6);
      --gradient-text: linear-gradient(135deg, #a5b4fc, #60a5fa);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(99,102,241,0.5);
      --card-bg: rgba(255,255,255,0.04);
      --input-bg: rgba(255,255,255,0.05);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── PARTICLES ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(99,102,241,0.15);
      animation: float linear infinite;
    }
    .particle:nth-child(1)  { width:3px;height:3px;left:10%;animation-duration:18s;animation-delay:-2s; }
    .particle:nth-child(2)  { width:2px;height:2px;left:20%;animation-duration:22s;animation-delay:-5s; }
    .particle:nth-child(3)  { width:4px;height:4px;left:30%;animation-duration:16s;animation-delay:-8s; }
    .particle:nth-child(4)  { width:2px;height:2px;left:40%;animation-duration:20s;animation-delay:-1s; }
    .particle:nth-child(5)  { width:3px;height:3px;left:50%;animation-duration:24s;animation-delay:-12s; }
    .particle:nth-child(6)  { width:2px;height:2px;left:60%;animation-duration:17s;animation-delay:-3s; }
    .particle:nth-child(7)  { width:4px;height:4px;left:70%;animation-duration:21s;animation-delay:-7s; }
    .particle:nth-child(8)  { width:2px;height:2px;left:80%;animation-duration:19s;animation-delay:-14s; }
    .particle:nth-child(9)  { width:3px;height:3px;left:90%;animation-duration:23s;animation-delay:-4s; }
    .particle:nth-child(10) { width:2px;height:2px;left:15%;animation-duration:15s;animation-delay:-9s; }
    .particle:nth-child(11) { width:3px;height:3px;left:55%;animation-duration:26s;animation-delay:-6s; }
    .particle:nth-child(12) { width:2px;height:2px;left:75%;animation-duration:18s;animation-delay:-11s; }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── GLOW ORBS ── */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
    }
    .glow-orb-1 { width:600px;height:600px;background:#6366f1;top:-200px;left:-200px; }
    .glow-orb-2 { width:500px;height:500px;background:#3b82f6;bottom:-100px;right:-100px; }

    /* ── CARD ── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .login-card {
      background: rgba(20, 20, 40, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.08);
    }

    /* ── LOGO ── */
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo img {
      width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }

    /* ── TAB SWITCHER ── */
    .tab-switcher {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99,102,241,0.35);
    }
    .tab-btn:not(.active):hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    /* ── FORMS ── */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .form-input::placeholder { color: var(--text-dim); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ── SUBMIT BUTTON ── */
    .btn-submit {
      width: 100%;
      padding: 14px 24px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99,102,241,0.5);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* ── SPINNER ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── MESSAGE BANNER ── */
    .message-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .message-banner.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .message-banner.success {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
    .message-banner.visible { display: block; }

    /* ── BACK LINK ── */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-muted); }

    /* ── FORGOT LINK ── */
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      margin-top: -10px;
      margin-bottom: 14px;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--purple); }

    /* ── ADMIN PADLOCK ── */
    #admin-lock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      opacity: 0.12;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s;
      user-select: none;
      z-index: 10;
      line-height: 1;
    }
    #admin-lock:hover { opacity: 0.45; transform: translateX(-50%) scale(1.15); }

    /* ── ADMIN MINI MODAL ── */
    #admin-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 60px;
    }
    #admin-modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #admin-modal {
      background: rgba(18, 18, 36, 0.95);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 16px;
      padding: 28px 28px 24px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(99,102,241,0.1);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    #admin-modal .modal-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
    }
    #admin-modal .modal-head .title {
      font-size: 14px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    #admin-modal .modal-head .close-btn {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px; transition: color 0.2s;
    }
    #admin-modal .modal-head .close-btn:hover { color: var(--text); }
    #admin-modal .modal-input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px; color: var(--text); font-size: 14px;
      font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
    }
    #admin-modal .modal-input:focus {
      border-color: rgba(99,102,241,0.5);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    #admin-modal .modal-btn {
      width: 100%; padding: 11px;
      background: var(--gradient); border: none; border-radius: 9px;
      color: #fff; font-size: 13px; font-weight: 700;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s;
    }
    #admin-modal .modal-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    #admin-modal .modal-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    #admin-modal .modal-error {
      font-size: 12px; color: #fca5a5; margin-top: 10px; text-align: center;
      min-height: 16px;
    }

    @media (max-width: 480px) {
      .login-card { padding: 28px 20px 24px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="particles" aria-hidden="true">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <div class="glow-orb glow-orb-1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-2" aria-hidden="true"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo">
        <img src="/novexa-logo.jpg" alt="Novexa">
      </div>

      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Connexion</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Créer un compte</button>
      </div>

      <!-- Message Banner -->
      <div class="message-banner" id="message-banner"></div>

      <!-- Login Form -->
      <div class="form-panel active" id="panel-login">
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="login-email">Adresse e-mail</label>
            <input class="form-input" type="email" id="login-email" placeholder="vous@exemple.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Mot de passe</label>
            <input class="form-input" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <span class="forgot-link" onclick="switchTab('forgot')">Mot de passe oublié ?</span>
          <button class="btn-submit" type="submit" id="btn-login">
            <span id="btn-login-label">Se connecter</span>
          </button>
        </form>
      </div>

      <!-- Forgot Password Form -->
      <div class="form-panel" id="panel-forgot">
        <form id="form-forgot" onsubmit="handleForgot(event)">
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6">Entrez votre email pour recevoir un lien de réinitialisation.</p>
          <div class="form-group">
            <label class="form-label" for="forgot-email">Adresse e-mail</label>
            <input class="form-input" type="email" id="forgot-email" placeholder="vous@exemple.com" required autocomplete="email" />
          </div>
          <button class="btn-submit" type="submit" id="btn-forgot">
            <span id="btn-forgot-label">Envoyer le lien</span>
          </button>
        </form>
        <span class="forgot-link" style="text-align:left;margin-top:14px;" onclick="switchTab('login')">← Retour à la connexion</span>
      </div>

      <!-- Reset Password Form -->
      <div class="form-panel" id="panel-reset">
        <form id="form-reset" onsubmit="handleReset(event)">
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6">Choisissez un nouveau mot de passe.</p>
          <input type="hidden" id="reset-token" />
          <div class="form-group">
            <label class="form-label" for="reset-password">Nouveau mot de passe</label>
            <input class="form-input" type="password" id="reset-password" placeholder="Minimum 6 caractères" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label class="form-label" for="reset-password2">Confirmer le mot de passe</label>
            <input class="form-input" type="password" id="reset-password2" placeholder="Répétez le mot de passe" required minlength="6" autocomplete="new-password" />
          </div>
          <button class="btn-submit" type="submit" id="btn-reset">
            <span id="btn-reset-label">Réinitialiser</span>
          </button>
        </form>
      </div>

      <!-- Register Form -->
      <div class="form-panel" id="panel-register">
        <form id="form-register" onsubmit="handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-prenom">Prénom</label>
              <input class="form-input" type="text" id="reg-prenom" placeholder="Jean" required autocomplete="given-name" />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-nom">Nom</label>
              <input class="form-input" type="text" id="reg-nom" placeholder="Dupont" required autocomplete="family-name" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Adresse e-mail</label>
            <input class="form-input" type="email" id="reg-email" placeholder="vous@exemple.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Mot de passe</label>
            <input class="form-input" type="password" id="reg-password" placeholder="Minimum 8 caractères" required autocomplete="new-password" minlength="8" />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-entreprise">Nom de l'entreprise</label>
            <input class="form-input" type="text" id="reg-entreprise" placeholder="Acme SAS" required autocomplete="organization" />
          </div>
          <button class="btn-submit" type="submit" id="btn-register">
            <span id="btn-register-label">Créer mon compte</span>
          </button>
        </form>
      </div>

      <!-- Back link -->
      <a href="/index.html" class="back-link">← Retour à l'accueil</a>

    </div>
  </div>

  <!-- Admin padlock -->
  <button id="admin-lock" onclick="openAdminModal()" title="" aria-label="Administration">🔒</button>

  <!-- Admin mini modal -->
  <div id="admin-modal-overlay" onclick="handleOverlayClick(event)">
    <div id="admin-modal">
      <div class="modal-head">
        <span class="title">🔐 Accès administration</span>
        <button class="close-btn" onclick="closeAdminModal()">✕</button>
      </div>
      <input class="modal-input" type="password" id="admin-pwd" placeholder="Mot de passe admin" autocomplete="off" />
      <button class="modal-btn" id="admin-modal-btn" onclick="doAdminLogin()">Accéder</button>
      <div class="modal-error" id="admin-modal-error"></div>
    </div>
  </div>

  <script>
    const API = 'https://nexulys-backend-1.onrender.com/api';

    // ── Tab switcher ──
    function switchTab(tab) {
      ['login','register','forgot','reset'].forEach(function(p) {
        document.getElementById('panel-' + p).classList.toggle('active', p === tab);
      });
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideBanner();
    }

    // ── Banner helpers ──
    function showBanner(msg, type) {
      const el = document.getElementById('message-banner');
      el.textContent = msg;
      el.className = 'message-banner visible ' + type;
    }
    function showError(msg) { showBanner(msg, 'error'); }
    function showSuccess(msg) { showBanner(msg, 'success'); }
    function hideBanner() {
      const el = document.getElementById('message-banner');
      el.className = 'message-banner';
    }

    // ── Loading state helpers ──
    function setLoading(btnId, labelId, loading, labelText) {
      const btn = document.getElementById(btnId);
      const label = document.getElementById(labelId);
      btn.disabled = loading;
      if (loading) {
        label.textContent = '';
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.id = 'spinner-' + btnId;
        label.parentNode.insertBefore(spinner, label);
      } else {
        const spinner = document.getElementById('spinner-' + btnId);
        if (spinner) spinner.remove();
        label.textContent = labelText;
      }
    }

    // ── Login ──
    async function login(email, password) {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('novexa_token', data.data.token);
        localStorage.setItem('novexa_user', JSON.stringify(data.data.utilisateur));
        window.location.href = '/dashboard.html';
      } else {
        showError(data.message || (data.errors && data.errors[0] && data.errors[0].message) || 'Erreur de connexion');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideBanner();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      setLoading('btn-login', 'btn-login-label', true, 'Se connecter');
      try {
        await login(email, password);
      } catch (err) {
        showError('Erreur réseau. Veuillez réessayer.');
      } finally {
        setLoading('btn-login', 'btn-login-label', false, 'Se connecter');
      }
    }

    // ── Register ──
    async function register(formData) {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(formData)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('novexa_token', data.data.token);
        localStorage.setItem('novexa_user', JSON.stringify(data.data.utilisateur));
        showSuccess(data.message || 'Compte créé avec succès ! Redirection...');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
      } else {
        showError(data.message || (data.errors && data.errors[0] && data.errors[0].message) || 'Erreur d\'inscription');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideBanner();
      const formData = {
        prenom: document.getElementById('reg-prenom').value.trim(),
        nom: document.getElementById('reg-nom').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        nomEntreprise: document.getElementById('reg-entreprise').value.trim()
      };
      setLoading('btn-register', 'btn-register-label', true, 'Créer mon compte');
      try {
        await register(formData);
      } catch (err) {
        showError('Erreur réseau. Veuillez réessayer.');
      } finally {
        setLoading('btn-register', 'btn-register-label', false, 'Créer mon compte');
      }
    }

    // ── Forgot password ──
    async function handleForgot(e) {
      e.preventDefault();
      hideBanner();
      const email = document.getElementById('forgot-email').value.trim();
      setLoading('btn-forgot', 'btn-forgot-label', true, 'Envoyer le lien');
      try {
        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
          showSuccess(data.message);
          document.getElementById('form-forgot').reset();
        } else {
          showError(data.message || 'Erreur');
        }
      } catch (err) { showError('Erreur réseau. Veuillez réessayer.'); }
      finally { setLoading('btn-forgot', 'btn-forgot-label', false, 'Envoyer le lien'); }
    }

    // ── Reset password ──
    async function handleReset(e) {
      e.preventDefault();
      hideBanner();
      const password = document.getElementById('reset-password').value;
      const password2 = document.getElementById('reset-password2').value;
      if (password !== password2) return showError('Les mots de passe ne correspondent pas.');
      const token = document.getElementById('reset-token').value;
      setLoading('btn-reset', 'btn-reset-label', true, 'Réinitialiser');
      try {
        const res = await fetch(`${API}/auth/reset-password`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (data.success) {
          showSuccess(data.message + ' Redirection...');
          setTimeout(function() { switchTab('login'); }, 2000);
        } else {
          showError(data.message || 'Lien invalide ou expiré.');
        }
      } catch (err) { showError('Erreur réseau.'); }
      finally { setLoading('btn-reset', 'btn-reset-label', false, 'Réinitialiser'); }
    }

    // ── Admin modal ──
    function openAdminModal() {
      document.getElementById('admin-modal-overlay').classList.add('open');
      document.getElementById('admin-modal-error').textContent = '';
      document.getElementById('admin-modal-btn').disabled = false;
      document.getElementById('admin-modal-btn').textContent = 'Accéder';
      setTimeout(function() { document.getElementById('admin-pwd').focus(); }, 80);
    }
    function closeAdminModal() {
      document.getElementById('admin-modal-overlay').classList.remove('open');
      document.getElementById('admin-pwd').value = '';
      document.getElementById('admin-modal-error').textContent = '';
    }
    function handleOverlayClick(e) {
      if (e.target === document.getElementById('admin-modal-overlay')) closeAdminModal();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeAdminModal();
    });
    document.getElementById('admin-pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doAdminLogin();
    });
    async function doAdminLogin() {
      var pwd = document.getElementById('admin-pwd').value.trim();
      var errEl = document.getElementById('admin-modal-error');
      var btn = document.getElementById('admin-modal-btn');
      if (!pwd) { errEl.textContent = 'Entrez le mot de passe.'; return; }
      btn.disabled = true;
      btn.textContent = '...';
      errEl.textContent = '';
      try {
        var res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        var data = await res.json();
        if (data.success) {
          sessionStorage.setItem('novexa_admin_token', data.token);
          window.location.href = '/admin.html';
        } else {
          errEl.textContent = data.message || 'Mot de passe incorrect.';
          btn.disabled = false;
          btn.textContent = 'Accéder';
        }
      } catch (err) {
        errEl.textContent = 'Erreur réseau.';
        btn.disabled = false;
        btn.textContent = 'Accéder';
      }
    }

    // ── Redirect if already logged in ──
    (function() {
      if (localStorage.getItem('novexa_token')) window.location.href = '/dashboard.html';
      // Check for reset token in URL
      const params = new URLSearchParams(window.location.search);
      const resetToken = params.get('reset');
      if (resetToken) {
        document.getElementById('reset-token').value = resetToken;
        switchTab('reset');
      }
    })();
  </script>
</body>
</html>
