<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Signature de contrat — Novexa</title>
<link rel="icon" type="image/jpeg" href="/novexa-icon.jpg" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0d0f1a;color:#e2e8f0;min-height:100vh;}
.header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 32px;display:flex;align-items:center;gap:12px;}
.brand{font-size:18px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.main{max-width:760px;margin:40px auto;padding:0 20px;}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.card-header{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.card-body{padding:24px;}
.info-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
.info-row .lbl{color:#94a3b8;}
.sign-box{background:rgba(99,102,241,.06);border:2px dashed rgba(99,102,241,.3);border-radius:12px;padding:24px;margin-top:20px;}
.field-label{font-size:12px;color:#94a3b8;margin-bottom:6px;display:block;}
.field-input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e2e8f0;font-size:14px;margin-bottom:16px;outline:none;}
.field-input:focus{border-color:rgba(99,102,241,.5);}
.checkbox-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;cursor:pointer;}
.checkbox-row input{width:20px;height:20px;margin-top:2px;accent-color:#6366f1;cursor:pointer;}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;padding:14px 32px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s;}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner{width:36px;height:36px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.success-view{text-align:center;padding:60px 20px;}
.badge-green{background:rgba(52,211,153,.12);color:#34d399;display:inline-flex;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
</style>
</head>
<body>
<div class="header">
  <div class="brand">Novexa</div>
  <span style="font-size:13px;color:#64748b;">Signature électronique de contrat</span>
</div>
<div class="main">
  <div id="loading"><div class="spinner"></div></div>
  <div id="content" style="display:none;"></div>
  <div id="signed-view" class="success-view" style="display:none;">
    <div style="font-size:64px;margin-bottom:16px;">✅</div>
    <h2 style="margin-bottom:8px;font-size:22px;">Contrat signé avec succès</h2>
    <p style="color:#64748b;margin-bottom:20px;">Votre signature a bien été enregistrée et horodatée.</p>
    <span class="badge-green">Signature électronique valide</span>
  </div>
  <div id="error-view" style="display:none;text-align:center;padding:80px 20px;">
    <div style="font-size:48px;margin-bottom:16px;">🔒</div>
    <h2 style="margin-bottom:8px;">Contrat introuvable</h2>
    <p style="color:#64748b;">Ce lien n'est plus valide. Contactez votre prestataire.</p>
  </div>
</div>

<script src="/js/signer-contrat.js"></script>
</body>
</html>
