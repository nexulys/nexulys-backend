<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Signature de devis — Novexa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0d0f1a;color:#e2e8f0;min-height:100vh;}
.header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 32px;display:flex;align-items:center;gap:12px;}
.brand{font-size:18px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.main{max-width:800px;margin:40px auto;padding:0 20px;}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.card-header{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;font-weight:700;}
.card-body{padding:24px;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06);}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.kpi{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px;text-align:center;}
.kpi-val{font-size:20px;font-weight:800;color:#a5b4fc;}
.kpi-label{font-size:11px;color:#64748b;margin-top:4px;}
.sign-box{background:rgba(99,102,241,.06);border:2px dashed rgba(99,102,241,.3);border-radius:12px;padding:24px;margin-top:20px;}
.checkbox-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;cursor:pointer;}
.checkbox-row input{width:20px;height:20px;margin-top:2px;accent-color:#6366f1;cursor:pointer;}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;padding:14px 32px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s;}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spinner{width:36px;height:36px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.success-view{text-align:center;padding:60px 20px;}
.badge-green{background:rgba(52,211,153,.12);color:#34d399;display:inline-flex;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-exp{background:rgba(248,113,113,.12);color:#f87171;display:inline-flex;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
.info-row .lbl{color:#94a3b8;}
</style>
</head>
<body>
<div class="header">
  <div class="brand">Novexa</div>
  <span style="font-size:13px;color:#64748b;">Signature électronique de devis</span>
</div>
<div class="main">
  <div id="loading"><div class="spinner"></div></div>
  <div id="content" style="display:none;"></div>
  <div id="signed-view" class="success-view" style="display:none;">
    <div style="font-size:64px;margin-bottom:16px;">✅</div>
    <h2 style="margin-bottom:8px;font-size:22px;">Devis signé avec succès</h2>
    <p style="color:#64748b;margin-bottom:20px;">Votre accord a bien été enregistré. L'entreprise va vous contacter prochainement.</p>
    <span class="badge-green">Signature électronique valide</span>
  </div>
  <div id="error-view" style="display:none;text-align:center;padding:80px 20px;">
    <div style="font-size:48px;margin-bottom:16px;">🔒</div>
    <h2 style="margin-bottom:8px;">Devis invalide ou expiré</h2>
    <p style="color:#64748b;">Ce lien n'est plus valide. Contactez votre prestataire.</p>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
const API = 'https://nexulys-backend-1.onrender.com/api';
const fmt = n => (n||0).toLocaleString('fr-FR', {minimumFractionDigits:2,maximumFractionDigits:2});
const DEVISES = { EUR: '€', USD: '$', GBP: '£', CHF: 'CHF' };

async function load() {
  if (!token) { show('error-view'); return; }
  try {
    const res = await fetch(API + '/devis/view/' + token);
    const data = await res.json();
    if (!data.success) { show('error-view'); return; }
    const d = data.data;
    const symbole = DEVISES[d.devise] || '€';
    const exp = new Date(d.dateValidite);
    const dejaSign = !!d.signedAt;

    if (dejaSign) { show('signed-view'); return; }

    document.getElementById('content').innerHTML = `
<div class="card">
  <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
    <span>Devis ${d.numero}</span>
    <span class="${exp < new Date() ? 'badge-exp' : 'badge-green'}">${exp < new Date() ? 'Expiré' : 'Valide jusqu\'au ' + exp.toLocaleDateString('fr-FR')}</span>
  </div>
  <div class="card-body">
    <div class="info-row"><span class="lbl">Client</span><span style="font-weight:600;">${d.client?.nom||'—'}</span></div>
    <div class="info-row"><span class="lbl">Référence</span><span>${d.numero}</span></div>
    <div class="info-row"><span class="lbl">Date</span><span>${new Date(d.createdAt).toLocaleDateString('fr-FR')}</span></div>
    ${d.notes ? `<div class="info-row"><span class="lbl">Notes</span><span style="color:#94a3b8;">${d.notes}</span></div>` : ''}
  </div>
</div>

<div class="card">
  <div class="card-header">Détail des prestations</div>
  <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Description</th><th>Qté</th><th>PU HT</th><th>TVA</th><th>Total HT</th></tr></thead>
      <tbody>
        ${(d.lignes||[]).map(l => `<tr>
          <td>${l.description}</td>
          <td>${l.quantite}</td>
          <td>${fmt(l.prixUnitaire)} ${symbole}</td>
          <td>${l.tva||20} %</td>
          <td style="font-weight:600;">${fmt(l.montantHT)} ${symbole}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi"><div class="kpi-val">${fmt(d.montantHT)} ${symbole}</div><div class="kpi-label">Total HT</div></div>
  <div class="kpi"><div class="kpi-val">${fmt(d.montantTVA)} ${symbole}</div><div class="kpi-label">TVA</div></div>
  <div class="kpi"><div class="kpi-val" style="color:#34d399;">${fmt(d.montantTTC)} ${symbole}</div><div class="kpi-label">Total TTC</div></div>
</div>

${exp >= new Date() ? `
<div class="sign-box">
  <h3 style="font-size:15px;font-weight:700;margin-bottom:16px;">Signature électronique</h3>
  <label class="checkbox-row">
    <input type="checkbox" id="chk1" onchange="checkSign()"/>
    <span style="font-size:13px;color:#94a3b8;">J'ai lu et j'accepte l'ensemble des prestations et conditions décrites dans ce devis.</span>
  </label>
  <label class="checkbox-row">
    <input type="checkbox" id="chk2" onchange="checkSign()"/>
    <span style="font-size:13px;color:#94a3b8;">Je confirme être habilité(e) à signer ce devis au nom de ${d.client?.nom||'mon organisation'}.</span>
  </label>
  <div id="sign-error" style="color:#f87171;font-size:13px;margin-bottom:12px;display:none;">Veuillez cocher les deux cases pour confirmer votre accord.</div>
  <button class="btn" id="sign-btn" onclick="signer()">✍️ Signer ce devis</button>
  <p style="font-size:11px;color:#475569;text-align:center;margin-top:12px;">Signature électronique conforme au règlement eIDAS — votre adresse IP sera enregistrée.</p>
</div>` : `<div style="text-align:center;padding:24px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:12px;color:#f87171;font-size:13px;">Ce devis a expiré le ${exp.toLocaleDateString('fr-FR')}. Contactez votre prestataire pour un renouvellement.</div>`}
`;
    show('content');
  } catch(e) { show('error-view'); }
}

function checkSign() {
  document.getElementById('sign-error').style.display = 'none';
}

async function signer() {
  const c1 = document.getElementById('chk1')?.checked;
  const c2 = document.getElementById('chk2')?.checked;
  if (!c1 || !c2) { document.getElementById('sign-error').style.display = ''; return; }
  const btn = document.getElementById('sign-btn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  try {
    const res = await fetch(API + '/devis/signer/' + token, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const data = await res.json();
    if (data.success) { show('signed-view'); }
    else { btn.disabled = false; btn.textContent = '✍️ Signer ce devis'; alert(data.message); }
  } catch(e) { btn.disabled = false; btn.textContent = '✍️ Signer ce devis'; alert('Erreur réseau'); }
}

function show(id) {
  ['loading','content','signed-view','error-view'].forEach(i => document.getElementById(i).style.display = i === id ? '' : 'none');
}

load();
</script>
</body>
</html>
