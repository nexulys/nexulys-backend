name: Novexa CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/novexa_test
          JWT_SECRET: test_secret_ci_only
          PORT: 5001

      - name: Check syntax (all JS files)
        run: find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/.git/*" -exec node --check {} \;

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t novexa-backend:${{ github.sha }} .

      - name: Test Docker image starts
        run: |
          docker run -d --name novexa-test \
            -e MONGODB_URI=mongodb://host.docker.internal:27017/novexa \
            -e JWT_SECRET=test_secret \
            -e PORT=5000 \
            -p 5000:5000 \
            novexa-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/api/health || exit 1
          docker stop novexa-test
